# Fly.io config. `fly launch --no-deploy` then `fly deploy`.
#
# NOT a free option: Fly ended its free allowances in 2024 and new accounts get
# a short trial only. It is here because it is the one host in this repo that
# gives the game a persistent volume, so high scores and study minutes survive a
# deploy without a database. For free hosting see render.yaml.
#
# The image contains the client as well as the server, so this is the whole
# game on one URL — no separate static deployment, no CORS to configure.
app = "the-commons"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "2567"
  # A mounted volume, so the JSON store survives a deploy. Drop this and the
  # [mounts] block below if you use DATABASE_URL instead.
  DATA_DIR = "/data"

[[mounts]]
  source = "commons_data"
  destination = "/data"

[http_service]
  internal_port = 2567
  force_https = true
  # WebSockets are long-lived: stopping idle machines drops everyone in a room.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
